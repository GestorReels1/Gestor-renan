  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  button, input, select, textarea { font-family: inherit; font-size: 14px; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  /* ---------- Shell ---------- */
  .app-shell {
    display: grid;
    grid-template-columns: 236px 1fr;
    min-height: 100%;
  }
  .sidebar {
    background: var(--panel-2);
    border-right: 1px solid var(--line);
    padding: 22px 16px;
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100%;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 6px;
  }
  .brand-mark {
    width: 10px; height: 10px; border-radius: 2px;
    background: var(--brass);
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .brand-text { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; line-height: 1.15; }
  .brand-sub { font-size: 11px; color: var(--ink-soft); padding: 0 6px; margin-top: -14px; }

  .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-s);
    background: none; border: none; text-align: left;
    color: var(--ink-soft);
    font-size: 14px; font-weight: 500;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item svg { flex-shrink: 0; opacity: .8; }
  .nav-item:hover { background: var(--line); color: var(--ink); }
  .nav-item.active { background: var(--brass); color: var(--paper); }
  .nav-item.active svg { opacity: 1; }

  .sidebar-foot { margin-top: auto; font-size: 11.5px; color: var(--ink-soft); padding: 0 6px; line-height: 1.5; }

  .main {
    padding: 28px 34px 60px;
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
    max-width: 1180px;
    width: 100%;
  }
  .topbar {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 26px; }
  .topbar .eyebrow { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px;
    border-radius: var(--radius-s);
    border: 1px solid var(--line-strong);
    background: var(--panel);
    font-weight: 600; font-size: 13.5px;
    transition: transform .08s ease, border-color .12s ease, background .12s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-soft); }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--brass); color: var(--paper); border-color: var(--brass); }
  .btn-primary:hover { background: var(--brass-deep); border-color: var(--brass-deep); color: var(--paper); }
  .btn-danger { color: var(--red); border-color: var(--red-tint); }
  .btn-danger:hover { background: var(--red-tint); border-color: var(--red); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--line); }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line-strong); background: var(--panel); }

  /* ---------- Panels / cards ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-l);
    padding: 20px;
  }
  .panel-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .panel-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 16px 18px;
  }
  .stat-card .n { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 600; line-height: 1; }
  .stat-card .l { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
  .stat-card.pendente .n { color: var(--ink); }
  .stat-card.gravado .n { color: var(--blue); }
  .stat-card.publicado .n { color: var(--green); }
  .stat-card.erro .n { color: var(--red); }
  .stat-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .stat-card.pendente .stat-icon { background: var(--panel-3); color: var(--ink-soft); }
  .stat-card.gravado .stat-icon { background: var(--blue-tint); color: var(--blue); }
  .stat-card.publicado .stat-icon { background: var(--green-tint); color: var(--green); }
  .stat-card.erro .stat-icon { background: var(--red-tint); color: var(--red); }

  /* ---------- Hero banner ---------- */
  .hero-banner {
    position: relative;
    border-radius: var(--radius-l);
    overflow: hidden;
    min-height: 240px;
    display: flex; align-items: flex-end;
    padding: 28px 30px;
    margin-bottom: 22px;
    background-image: linear-gradient(180deg, rgba(20,16,11,0.12) 0%, rgba(14,11,8,0.94) 96%), var(--hero-img);
    background-size: cover;
    background-position: center 28%;
    box-shadow: var(--shadow-2);
  }
  .hero-content { position: relative; z-index: 1; max-width: 460px; }
  .hero-eyebrow { font-size: 12px; letter-spacing: 0.02em; color: var(--brass-deep); font-weight: 700; margin-bottom: 10px; }
  .hero-title { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; color: #F8F4EC; line-height: 1.12; margin-bottom: 10px; }
  .hero-sub { font-size: 13.5px; color: rgba(248,244,236,0.72); max-width: 380px; margin-bottom: 20px; line-height: 1.5; }
  .hero-actions { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .hero-stats { display: flex; gap: 22px; }
  .hero-stat b { font-family: 'Fraunces', serif; font-size: 21px; color: #F8F4EC; display: block; line-height: 1; }
  .hero-stat span { font-size: 11px; color: rgba(248,244,236,0.6); }
  .hero-cta {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--brass); color: var(--paper); font-weight: 700; font-size: 13.5px;
    padding: 11px 18px 11px 20px; border-radius: 99px; border: none;
  }
  .hero-cta:hover { background: var(--brass-deep); }

  .section-gap { margin-bottom: 22px; }
  .two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }

  /* ---------- Status pill ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
    white-space: nowrap;
  }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.st-pendente { background: var(--panel-2); color: var(--ink-soft); }
  .pill.st-gravado { background: var(--blue-tint); color: var(--blue); }
  .pill.st-publicado { background: var(--green-tint); color: var(--green); }
  .pill.st-erro { background: var(--red-tint); color: var(--red); }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px 3px 5px; border-radius: 99px; background: var(--panel-2); }
  .plat-dot { width: 16px; height: 16px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 8.5px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .plat-instagram { background: linear-gradient(135deg,#e0a13a,#c8388a 55%,#6d4fc4); }
  .plat-tiktok { background: #111; }
  .plat-facebook { background: #3B5B95; }
  .plat-youtube { background: #C4342B; }

  /* ---------- Roteiros list ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type="text"], .toolbar select {
    padding: 8px 11px; border-radius: var(--radius-s); border: 1px solid var(--line-strong);
    background: var(--panel);
  }
  .toolbar input[type="text"] { flex: 1; min-width: 160px; }
  .status-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-chip {
    padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line-strong);
    background: var(--panel); font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
  }
  .status-chip.active { background: var(--brass); color: var(--paper); border-color: var(--brass); }

  .script-card {
    display: flex; gap: 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .script-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
  .script-thumb {
    width: 56px; height: 56px; border-radius: var(--radius-s); background: var(--panel-2);
    object-fit: cover; flex-shrink: 0; border: 1px solid var(--line);
  }
  .script-thumb.empty { display: flex; align-items: center; justify-content: center; color: var(--ink-soft); }
  .script-main { flex: 1; min-width: 0; }
  .script-title { font-weight: 600; font-size: 14.5px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .script-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); }
  .script-icons { display: flex; gap: 8px; color: var(--ink-soft); flex-shrink: 0; }
  .script-icons .has { color: var(--brass); }
  .script-updated { font-size: 11.5px; color: var(--ink-soft); flex-shrink: 0; width: 80px; text-align: right; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state .display { font-size: 20px; color: var(--ink); margin-bottom: 6px; }

  /* ---------- Contas grid ---------- */
  .accounts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .account-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 18px; position: relative; }
  .account-card.rank-1 { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .account-card.rank-2 { border-color: var(--silver); box-shadow: 0 0 0 1px var(--silver) inset; }
  .account-card.rank-3 { border-color: var(--bronze); box-shadow: 0 0 0 1px var(--bronze) inset; }

const urlCache = new Map();

function uid(){ return crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ return new Date(d).toLocaleDateString('pt-BR'); }
function fmtDateShort(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}`; }
function fmtSize(bytes){
  if(!bytes && bytes!==0) return '';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0)+' KB';
  return (bytes/(1024*1024)).toFixed(1)+' MB';
}
function fmtRelative(ts){
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if(min < 1) return 'agora';
  if(min < 60) return `${min} min atrás`;
  const h = Math.floor(min/60);
  if(h < 24) return `${h}h atrás`;
  const d = Math.floor(h/24);
  if(d < 7) return `${d}d atrás`;
  return fmtDate(ts);
}
function getURL(key, file){
  if(!file) return null;
  if(urlCache.has(key)) return urlCache.get(key);
  const url = URL.createObjectURL(file);
  urlCache.set(key, url);
  return url;
}
function invalidateURL(key){
  if(urlCache.has(key)){ URL.revokeObjectURL(urlCache.get(key)); urlCache.delete(key); }
}
function escapeHTML(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}

/* ============================= SWIPE ENTRE ABAS ============================= */
(function(){
  const mainEl = document.getElementById('main');
  let touchStartX = 0, touchStartY = 0, touching = false;
  mainEl.addEventListener('touchstart', e=>{
    const dentroDeScrollLateral = e.target.closest('.chart-wrap, .status-chips');
    const modalAberto = document.getElementById('modalRoot')?.children.length;
    if(dentroDeScrollLateral || modalAberto){ touching = false; return; }
    touching = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  mainEl.addEventListener('touchend', e=>{
    if(!touching) return;
    touching = false;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = NAV_ITEMS.findIndex(it => it.key === currentTab);
    if(idx === -1) return;
    const nextIdx = dx < 0 ? idx + 1 : idx - 1;
    if(nextIdx < 0 || nextIdx >= NAV_ITEMS.length) return;
    location.hash = NAV_ITEMS[nextIdx].key;
  }, { passive: true });
})();

function buildFollowerSeries(accts){
  const dateSet = new Set();
  accts.forEach(a => (a.followersHistory||[]).forEach(h => dateSet.add(h.date)));
  const dates = Array.from(dateSet).sort();
  const series = accts.map(a=>{
    const hist = [...(a.followersHistory||[])].sort((x,y)=>x.date.localeCompare(y.date));
    let idx = -1, lastVal = null;
    const values = dates.map(d=>{
      while(idx+1 < hist.length && hist[idx+1].date <= d){ idx++; lastVal = hist[idx].count; }
      return lastVal;
    });
    return { id:a.id, name:a.name, color:a.chartColor, values };
  });
  return { dates, series };
}
function lineChartSVG(dates, series, opts={}){
  const W = opts.width || 640, H = opts.height || 230;
  const padL = 42, padR = 14, padT = 16, padB = 26;
  if(dates.length === 0){
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="var(--ink-soft)">Sem dados de seguidores ainda</text></svg>`;
  }
  let allVals = [];
  series.forEach(s => s.values.forEach(v => { if(v!=null) allVals.push(v); }));
  if(allVals.length === 0) allVals = [0,1];
  let min = Math.min(...allVals), max = Math.max(...allVals);
  if(min === max){ min = min*0.95; max = max*1.05 || 1; }
  const pad = (max-min)*0.1;
  min = Math.max(0, min - pad); max = max + pad;

  const xStep = dates.length > 1 ? (W - padL - padR) / (dates.length - 1) : 0;
  const yScale = v => H - padB - ((v - min) / (max - min)) * (H - padT - padB);
  const xScale = i => padL + i * xStep;

  let grid = '';
  const gridLines = 4;
  for(let g=0; g<=gridLines; g++){
    const y = padT + (H-padT-padB) * (g/gridLines);
    const val = Math.round(max - (max-min)*(g/gridLines));
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="10" fill="var(--ink-soft)">${val.toLocaleString('pt-BR')}</text>`;
  }
  const xTickEvery = Math.max(1, Math.ceil(dates.length/6));
  let xlabels = '';
  dates.forEach((d,i)=>{
    if(i % xTickEvery === 0 || i === dates.length-1){
      xlabels += `<text x="${xScale(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-soft)">${fmtDateShort(d)}</text>`;
    }
  });

  let paths = '';
  series.forEach(s=>{
    let d = ''; let started = false;
    s.values.forEach((v,i)=>{
      if(v==null) return;
      const cmd = started ? 'L' : 'M';
      d += `${cmd}${xScale(i).toFixed(1)},${yScale(v).toFixed(1)} `;
      started = true;
    });
    if(d) paths += `<path d="${d.trim()}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.values.forEach((v,i)=>{
      if(v==null) return;
      if(i === s.values.length-1 || s.values[i+1]==null){
        paths += `<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(v).toFixed(1)}" r="3.2" fill="${s.color}"/>`;
      }
    });
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;min-width:460px">${grid}${xlabels}${paths}</svg>`;
}

function wireScriptModal(){
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeScriptModal(); });
  document.getElementById('btnCloseModal').onclick = closeScriptModal;
  document.getElementById('btnCancelModal').onclick = closeScriptModal;

  document.getElementById('btnCopyText').onclick = async ()=>{
    const val = document.getElementById('fText').value;
    try { await navigator.clipboard.writeText(val); toast('Texto copiado'); }
    catch(e){ toast('Não foi possível copiar'); }
  };

  document.getElementById('btnSaveScript').onclick = async ()=>{
    const title = document.getElementById('fTitle').value.trim();
    if(!title){ toast('Dê um título ao roteiro'); return; }
    modalScript.title = title;
    modalScript.accountId = document.getElementById('fAccount').value;
    modalScript.status = document.getElementById('fStatus').value;
    modalScript.text = document.getElementById('fText').value;
    modalScript.observation = document.getElementById('fObs').value;
    modalScript.videoStyle = modalVideoStylePreset === 'Outro' ? modalVideoStyleCustom.trim() : modalVideoStylePreset;
    const wasNew = modalIsNew;
    await persistScript(wasNew ? 'Roteiro criado' : 'Alterações salvas');
    if(wasNew){ modalIsNew = false; renderScriptModal(); }
    renderPage();
  };

  if(!modalIsNew){
    const delBtn = document.getElementById('btnDeleteScript');
    if(delBtn) delBtn.onclick = async ()=>{
      if(!confirm('Excluir este roteiro e todos os arquivos anexados?')) return;
      await dbDelete('scripts', modalScript.id);
      scripts = scripts.filter(x=>x.id!==modalScript.id);
      closeScriptModal();
      renderPage();
      toast('Roteiro excluído');
    };

    document.getElementById('inputPhoto').onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      toast('Enviando foto...');
      try {
        modalScript.photo = await uploadArquivo(file, 'fotos');
        await persistScript('Foto atualizada');
      } catch(err){ toast('Falha ao enviar foto: ' + err.message); }
      renderScriptModal();
    };
    document.getElementById('btnUploadPhoto').onclick = ()=>document.getElementById('inputPhoto').click();
    const rmPhoto = document.getElementById('btnRemovePhoto');
    if(rmPhoto) rmPhoto.onclick = async ()=>{
      modalScript.photo = null;
      await persistScript('Foto removida');
      renderScriptModal();
    };

    document.getElementById('fRawLink').onchange = async (e)=>{
      const url = e.target.value.trim();
      modalScript.rawVideo = url ? { url } : null;
      await persistScript('Link do vídeo bruto salvo');
      renderScriptModal();
    };

    document.getElementById('btnAddVersion').onclick = async ()=>{
      const url = document.getElementById('fNewVersionLink').value.trim();
      if(!url){ toast('Cole o link do vídeo editado'); return; }
      const label = document.getElementById('fNewVersionLabel').value.trim() || `Versão ${(modalScript.finalVersions||[]).length+1}`;
      const v = { id: uid(), label, url, addedAt: Date.now() };
      modalScript.finalVersions = modalScript.finalVersions || [];
      modalScript.finalVersions.push(v);
      await persistScript('Vídeo editado adicionado');
      renderScriptModal();
    };

    document.querySelectorAll('[data-remove-v]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Remover este link?')) return;
        modalScript.finalVersions = modalScript.finalVersions.filter(x=>x.id!==b.dataset.removeV);
        await persistScript('Vídeo editado removido');
        renderScriptModal();
      };
    });
    document.querySelectorAll('.version-label').forEach(inp=>{
      inp.onchange = async ()=>{
        const v = modalScript.finalVersions.find(x=>x.id===inp.dataset.vid);
        v.label = inp.value.trim() || v.label;
        await persistScript();
      };
    });
  }

  const btnInfo = document.getElementById('btnInfoArquivos');
  if(btnInfo) btnInfo.onclick = ()=>{
    const el = document.getElementById('infoArquivos');
    el.style.display = el.style.display==='none' ? 'block' : 'none';
  };
}

/* ============================= CONTAS ============================= */
const CHART_PALETTE = ['#A97C3F','#3E6690','#3F7A5C','#B0472F','#7A5FB0','#C9A227','#4A8FA8','#95605A'];
function colorForIndex(i){ return CHART_PALETTE[i % CHART_PALETTE.length]; }

function scriptCountsForAccount(accId){
  const list = scripts.filter(s=>s.accountId===accId);
  return {
    total: list.length,
    pendente: list.filter(s=>s.status==='Pendente').length,
    publicado: list.filter(s=>s.status==='Publicado').length,
  };
}
function renderContas(){
  return `
    <div class="topbar">
      <div><div class="eyebrow">${accounts.length} conta(s)</div><h1>Contas</h1></div>
      <button class="btn btn-primary" id="btnNewAccount">+ Nova conta</button>
    </div>

    <div class="accounts-grid">
      ${accounts.map((a)=>{
        const stats = scriptCountsForAccount(a.id);
        const hist = [...(a.followersHistory||[])].sort((x,y)=>x.date.localeCompare(y.date));
        const prev = hist.length>1 ? hist[hist.length-2].count : null;
        const diff = prev!=null ? a.followers - prev : null;
        return `
        <div class="account-card ${a.rank?'rank-'+a.rank:''}">
          ${a.rank ? `<div class="rank-medal">${a.rank===1?'🥇':a.rank===2?'🥈':'🥉'}</div>` : ''}
          <div class="account-head">
            <div class="plat-dot ${PLATFORM_META[a.platform].cls}">${PLATFORM_META[a.platform].short}</div>
            <div class="account-name">${escapeHTML(a.name)}</div>
          </div>
          <div class="account-handle">@${escapeHTML(a.handle||'')}</div>

          <div class="followers-box">
            <span class="n" id="followersDisplay-${a.id}">${a.followers.toLocaleString('pt-BR')}</span>
            ${diff!=null && diff!==0 ? `<span class="followers-diff ${diff>0?'up':'down'}">${diff>0?'+':''}${diff.toLocaleString('pt-BR')}</span>` : ''}
            <button class="btn btn-ghost btn-sm" data-edit-followers="${a.id}" style="margin-left:auto">Editar</button>
          </div>
          <div class="followers-label">seguidores</div>

          <div class="account-stats-row">
            <div style="flex:1"><div>${stats.publicado}</div><span>Publicados</span></div>
            <div style="flex:1"><div>${stats.pendente}</div><span>Pendentes</span></div>
            <div style="flex:1"><div>${stats.total}</div><span>Roteiros</span></div>
          </div>

          <div class="rank-row">
            <button class="rank-btn gold ${a.rank===1?'on':''}" data-rank="${a.id}:1">Top 1</button>
            <button class="rank-btn silver ${a.rank===2?'on':''}" data-rank="${a.id}:2">Top 2</button>
            <button class="rank-btn bronze ${a.rank===3?'on':''}" data-rank="${a.id}:3">Top 3</button>
          </div>
          <div class="account-card-foot">
            <button class="btn btn-ghost btn-sm" data-edit-account="${a.id}">Editar conta</button>
            <button class="btn btn-ghost btn-sm" data-delete-account="${a.id}">Excluir conta</button>
          </div>
        </div>`;
      }).join('') || `<div class="empty-state"><div class="display">Nenhuma conta cadastrada</div><div>Adicione as contas de Instagram, TikTok, Facebook ou YouTube que recebem os vídeos.</div></div>`}
    </div>
  `;
}
function openAccountModal(existingId){
  const editing = !!existingId;
  const acc = editing ? accounts.find(a=>a.id===existingId) : null;
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" style="max-width:460px">
      <div class="modal-head"><h2 style="font-size:18px">${editing ? 'Editar conta' : 'Nova conta'}</h2><button class="modal-close" id="btnCloseModal">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label>Plataforma</label>
          <select id="aPlatform">
            ${Object.entries(PLATFORM_META).map(([k,v])=>`<option value="${k}" ${editing && acc.platform===k ? 'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Nome da conta</label>
          <input type="text" id="aName" placeholder="Ex: Imóveis Curitiba" value="${editing ? escapeHTML(acc.name) : ''}">
        </div>
        <div class="field">
          <label>@handle</label>
          <input type="text" id="aHandle" placeholder="Ex: imoveiscuritiba" value="${editing ? escapeHTML(acc.handle||'') : ''}">
        </div>
        ${!editing ? `
        <div class="field">
          <label>Seguidores atuais</label>
          <input type="number" id="aFollowers" placeholder="0" min="0">
        </div>` : `<div class="hint">Para atualizar o número de seguidores, use o botão "Editar" no card da conta.</div>`}
      </div>
      <div class="modal-foot">
        <div></div>
        <div style="display:flex;gap:8px">
          <button class="btn" id="btnCancelModal">Cancelar</button>
          <button class="btn btn-primary" id="btnSaveAccount">${editing ? 'Salvar alterações' : 'Criar conta'}</button>
        </div>
      </div>
    </div>
  </div>`;
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeScriptModal(); });
  document.getElementById('btnCloseModal').onclick = closeScriptModal;
  document.getElementById('btnCancelModal').onclick = closeScriptModal;
  document.getElementById('btnSaveAccount').onclick = async ()=>{
    const name = document.getElementById('aName').value.trim();
    if(!name){ toast('Dê um nome para a conta'); return; }
    const handle = document.getElementById('aHandle').value.trim();
    const platform = document.getElementById('aPlatform').value;

    if(editing){
      acc.name = name;
      acc.handle = handle;
      acc.platform = platform;
      await dbPut('accounts', acc);
      closeScriptModal();
      renderPage();
      toast('Conta atualizada');
    } else {
      const followers = Math.max(0, parseInt(document.getElementById('aFollowers').value || '0', 10));
      const newAcc = {
        id: uid(),
        platform, name, handle,
        followers,
        followersHistory: [{ date: todayISO(), count: followers }],
        rank: null,
        chartColor: colorForIndex(accounts.length),
        createdAt: Date.now(),
      };
      await dbPut('accounts', newAcc);
      accounts.push(newAcc);
      closeScriptModal();
      renderPage();
      toast('Conta criada');
    }
  };
}
async function updateFollowers(accId, newVal){
  const acc = accounts.find(a=>a.id===accId);
  acc.followers = newVal;
  acc.followersHistory = acc.followersHistory || [];
  const today = todayISO();
  const existing = acc.followersHistory.find(h=>h.date===today);
  if(existing) existing.count = newVal; else acc.followersHistory.push({date:today, count:newVal});
  await dbPut('accounts', acc);
  toast('Seguidores atualizados');
  renderPage();
}
async function setRank(accId, rank){
  const acc = accounts.find(a=>a.id===accId);
  const turningOn = acc.rank !== rank;
  for(const a of accounts){
    if(a.id!==accId && a.rank===rank){ a.rank=null; await dbPut('accounts',a); }
  }
  acc.rank = turningOn ? rank : null;
  await dbPut('accounts', acc);
  renderPage();
}

/* ============================= EVOLUÇÃO ============================= */
function renderEvolucao(){
  const totalPublicados = scripts.filter(s=>s.status==='Publicado').length;
  const totalPendentes = scripts.filter(s=>s.status==='Pendente').length;
  const totalFollowers = accounts.reduce((sum,a)=>sum+a.followers,0);
  const top = [1,2,3].map(r=>accounts.find(a=>a.rank===r));

  const { dates, series } = buildFollowerSeries(accounts);

  return `
    <div class="topbar">
      <div><div class="eyebrow">Desempenho</div><h1>Evolução</h1></div>
    </div>

    <div class="overview-grid">
      <div class="stat-card publicado"><div class="n">${totalPublicados}</div><div class="l">Posts publicados</div></div>
      <div class="stat-card pendente"><div class="n">${totalPendentes}</div><div class="l">Roteiros pendentes</div></div>
      <div class="stat-card"><div class="n">${totalFollowers.toLocaleString('pt-BR')}</div><div class="l">Seguidores (soma de todas as contas)</div></div>
      <div class="stat-card"><div class="n">${accounts.length}</div><div class="l">Contas ativas</div></div>
    </div>

    <div class="podium">
      ${[0,1,2].map(i=>{
        const a = top[i];
        const medal = ['🥇','🥈','🥉'][i];
        if(!a) return `<div class="podium-card empty">Top ${i+1} ainda não definido</div>`;
        return `<div class="podium-card"><div class="medal">${medal}</div><div class="name">${escapeHTML(a.name)}</div><div class="followers">${a.followers.toLocaleString('pt-BR')}</div></div>`;
      }).join('')}
    </div>

    <div class="panel section-gap">
      <div class="panel-title">Evolução geral de seguidores</div>
      <div class="panel-sub">Comparativo entre todas as contas</div>
      <div class="chart-wrap">${lineChartSVG(dates, series)}</div>
      ${series.length ? `<div class="chart-legend">${series.map(s=>`<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${escapeHTML(s.name)}</div>`).join('')}</div>` : ''}
    </div>

    <div class="panel-title" style="margin-bottom:12px">Evolução por conta</div>
    ${accounts.length ? accounts.map(a=>{
      const stats = scriptCountsForAccount(a.id);
      const own = buildFollowerSeries([a]);
      return `
      <div class="account-evo-row">
        <div class="account-evo-head">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="plat-dot ${PLATFORM_META[a.platform].cls}">${PLATFORM_META[a.platform].short}</div>
            <div>
              <div style="font-weight:600">${escapeHTML(a.name)} ${a.rank ? (a.rank===1?'🥇':a.rank===2?'🥈':'🥉') : ''}</div>
              <div style="font-size:12px;color:var(--ink-soft)">@${escapeHTML(a.handle||'')}</div>
            </div>
          </div>
          <div class="account-evo-stats">
            <div><b>${a.followers.toLocaleString('pt-BR')}</b>seguidores</div>
            <div><b>${stats.publicado}</b>publicados</div>
            <div><b>${stats.pendente}</b>pendentes</div>
          </div>
        </div>
        <div class="chart-wrap">${lineChartSVG(own.dates, own.series, {height:150})}</div>
      </div>`;
    }).join('') : `<div class="empty-state"><div>Cadastre contas para acompanhar a evolução de cada uma.</div></div>`}
  `;
}

/* ============================= ROUTER / WIRING ============================= */
function renderPage(){
  const main = document.getElementById('main');
  if(currentTab==='dashboard') main.innerHTML = renderDashboard();
  else if(currentTab==='roteiros') main.innerHTML = renderRoteiros();
  else if(currentTab==='contas') main.innerHTML = renderContas();
  else if(currentTab==='evolucao') main.innerHTML = renderEvolucao();
  else main.innerHTML = renderDashboard();
  wirePage();
}
function wirePage(){
  const newScriptBtn = document.getElementById('btnNewScript');
  if(newScriptBtn) newScriptBtn.onclick = ()=>openScriptModal(null);

  document.querySelectorAll('[data-open-script]').forEach(el=>{
    el.onclick = ()=>openScriptModal(el.dataset.openScript);
  });

  if(currentTab==='roteiros'){
    document.getElementById('scriptSearch').oninput = (e)=>{ scriptFilter.q = e.target.value; renderPage(); };
    document.getElementById('filterAccount').onchange = (e)=>{ scriptFilter.accountId = e.target.value; renderPage(); };
    document.querySelectorAll('.status-chip').forEach(b=>{
      b.onclick = ()=>{ scriptFilter.status = b.dataset.status; renderPage(); };
    });
  }

  if(currentTab==='contas'){
    const newAcc = document.getElementById('btnNewAccount');
    if(newAcc) newAcc.onclick = ()=>openAccountModal(null);

    document.querySelectorAll('[data-edit-account]').forEach(btn=>{
      btn.onclick = ()=>openAccountModal(btn.dataset.editAccount);
    });

    document.querySelectorAll('[data-edit-followers]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.editFollowers;
        const acc = accounts.find(a=>a.id===id);
        const span = document.getElementById('followersDisplay-'+id);
        const input = document.createElement('input');
        input.type = 'number'; input.min = '0'; input.value = acc.followers;
        span.replaceWith(input);
        input.focus(); input.select();
        const commit = ()=>{
          const val = Math.max(0, parseInt(input.value||'0',10));
          updateFollowers(id, val);
        };
        input.addEventListener('keydown',(e)=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') renderPage(); });
        input.addEventListener('blur', commit);
      };
    });
    document.querySelectorAll('[data-rank]').forEach(btn=>{
      btn.onclick = ()=>{
        const [id, rank] = btn.dataset.rank.split(':');
        setRank(id, parseInt(rank,10));
      };
    });
    document.querySelectorAll('[data-delete-account]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Excluir esta conta? Roteiros vinculados a ela permanecerão, mas sem conta associada.')) return;
        const id = btn.dataset.deleteAccount;
        await dbDelete('accounts', id);
        accounts = accounts.filter(a=>a.id!==id);
        renderPage();
        toast('Conta excluída');
      };
    });
  }
}

/* ============================= BOOT ============================= */
async function boot(){
  if(!document.getElementById('modalRoot')){
    const d = document.createElement('div'); d.id = 'modalRoot'; document.body.appendChild(d);
  }
  document.getElementById('btnLogout').onclick = fazerLogout;
  accounts = await dbGetAll('accounts');
  scripts = await dbGetAll('scripts');
  accounts.forEach((a,i)=>{ if(!a.chartColor) a.chartColor = colorForIndex(i); });
  renderNav();
  renderPage();
}
iniciarSessao();
</script>
